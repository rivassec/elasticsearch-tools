name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run shellcheck
        run: |
          set -euo pipefail
          mapfile -t files < <(find . -type f -name '*.sh' -not -path './.git/*' | sort)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No shell scripts found; nothing to check."
            exit 0
          fi
          echo "Checking:"
          printf '  %s\n' "${files[@]}"
          shellcheck "${files[@]}"

  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run test suite
        run: |
          set -euo pipefail
          shopt -s nullglob globstar
          bats_files=(tests/**/*.bats)
          sh_tests=(tests/**/*_test.sh tests/**/test_*.sh)
          if [ ${#bats_files[@]} -gt 0 ]; then
            echo "Detected bats tests; installing bats."
            sudo apt-get update && sudo apt-get install -y bats
            bats "${bats_files[@]}"
          elif [ ${#sh_tests[@]} -gt 0 ]; then
            echo "Detected shell test scripts."
            for t in "${sh_tests[@]}"; do
              echo "Running $t"
              bash "$t"
            done
          else
            echo "No tests found in tests/ yet; skipping."
            echo "Add tests/*.bats (bats) or tests/*_test.sh (shell) to enable this job."
          fi
